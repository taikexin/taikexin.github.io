/* 解析音/视频文件内容：音频→语音转文字；视频→字幕+语音。结果存 item.transcript / item.frames */
function analyzeMedia(i){
  var f=impFiles[i];
  if(!f||!f.dataUrl) return;
  if(f.analyzing) return;
  f.analyzing=true; f.analyzeMsg='';
  renderImport();
  var isVid=(f.type==='video');
  analyzeMediaFile(f.dataUrl,f.type,f.ext||(isVid?'mp4':'mp3')).then(function(r){
    f.analyzing=false;

      f.transcript=r.transcript.trim();

function createUnitFromImport(im){
  var title=im.label||'新学习单元';
  var date=todayStr();
  var vocab=[], sentences=[], resources=[], noteParts=[];
  (im.files||[]).forEach(function(f){
    if(f.type==='video') resources.push({type:'video',title:f.name,url:f.dataUrl||'',thumb:f.thumb||'',cat:f.cat,name:f.name,note:f.transcript||'',frames:f.frames||''});
    else if(f.type==='audio') resources.push({type:'audio',title:f.name,url:f.dataUrl||'',cat:f.cat,name:f.name,note:f.transcript||''});
    else if(f.type==='image') resources.push({type:'image',title:f.name,url:f.thumb||f.dataUrl||'',thumb:f.thumb||'',cat:f.cat,name:f.name});
    else resources.push({type:'file',title:f.name,url:f.dataUrl||'',cat:f.cat,name:f.name});
    /* 音视频解析出的文字稿：存入 note，并自动提取句子加入单元 */
    if(f.transcript&&f.transcript.trim()){
      noteParts.push(f.transcript.trim());
      var pt=parseText(f.transcript.trim());
      (pt.sentences||[]).forEach(function(s){
        if(s.en&&sentences.every(function(x){ return x.en!==s.en; })) sentences.push(s);
      });
    }
  });
  (im.links||[]).forEach(function(l){
    var r={type:l.type||'link',title:l.title||'网页链接',url:l.url,thumb:l.thumb||'',source:l.source||''};
    if(l.meta&&l.meta.desc) r.desc=l.meta.desc;
    resources.push(r);
  });
  var parentPrompt={q:'Look at the video together. What did you see?',a:'和孩子一起看资源，边看边问 "What is this?"，用资源里的词来回答。'};
  var unit={id:uid('u'),date:date,title:title,goal:'',status:'已确认',createdAt:Date.now(),
    source:{type:im.source,raw:im.raw||'',imgs:(im.imgs||[]).slice(),files:(im.files||[]).map(function(f){ return {name:f.name,size:f.size,cat:f.cat,type:f.type,dataUrl:f.dataUrl,transcript:f.transcript||''}; }),links:(im.links||[]).slice()},
    vocab:vocab,sentences:sentences,resources:resources,homework:[],parentPrompt:parentPrompt,
    note:noteParts.join('\n\n'),
    tasks:[
      {id:uid('tk'),type:'video',label:'看老师发的视频',done:0},
      {id:uid('tk'),type:'talk',label:'亲子对话',done:0},
      {id:uid('tk'),type:'game',label:'小游戏',done:0}
    ],editable:true};
  S.units.push(unit);
  im.status='parsed'; im.unitId=unit.id; im.label=title;
  save(); render();
  toast('已生成单元「'+esc(title)+'」'+(sentences.length?'，并从语音中提取了 '+sentences.length+' 个句子':''));
  setTimeout(function(){ navTo('unit',unit.id); },420);
}

function addLinks(){
  var inp=document.getElementById('linkInput'); if(!inp) return;
  var raw=inp.value.split(/\r?\n/).map(function(x){ return x.trim(); }).filter(Boolean);
  raw.forEach(function(u){

    var info=guessLink(u);

    impLinks.push(item);

  });

/* 链接自动分析：调本地服务 /vmeta，成功后更新卡片的标题/简介/封面 */
function analyzeLinkItem(i){
  var item=impLinks[i];
  if(!item) return;
  item.analyzing=true; item.meta=null; item.error='';
  renderImport();
  vmetaLookup(item.url,function(m){
    if(!impLinks[i]) return;
    item.analyzing=false;
    if(m&&m.title){
      item.meta=m;
      item.title=m.title; item.source=m.source||item.source; item.thumb=m.thumb||item.thumb;
    } else item.error=(m&&m.error)||'本地服务未连接';
    renderImport();
  });
}
function guessLink(u){
  var host=(u.match(/^https?:\/\/([^\/]+)/)||[])[1]||'';
  var lower=(host+u).toLowerCase();
  if(/youtube\.com|youtu\.be/.test(host)) return {title:'YouTube 视频',source:'YouTube',type:'video'};
  if(/bilibili\.com|b23\.tv/.test(host)) return {title:'哔哩哔哩视频',source:'B站',type:'video'};
  if(/v\.qq\.com/.test(host)) return {title:'腾讯视频',source:'腾讯视频',type:'video'};
  if(/channels\.weixin|finder\.video|wx[a-z]+\.qq\.com/.test(host)) return {title:'微信视频号',source:'视频号',type:'video'};
  if(/mp\.weixin\.qq\.com/.test(host)) return {title:'公众号文章',source:'微信公众号',type:'article'};
  if(/xiaohongshu|xhslink/.test(host)) return {title:'小红书笔记',source:'小红书',type:'article'};
  if(/zhihu/.test(host)) return {title:'知乎内容',source:'知乎',type:'article'};
  return {title:u.slice(0,40),source:host,type:'link'};
}

function importData(file){
  if(!file) return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var j=JSON.parse(r.result);
      var d=j.data||j;
      if(!d.units) throw new Error('bad');
      /* 合并导入：按 id 去重追加，不覆盖本地已有数据（伙伴/换设备场景最安全） */
      var uids={}; S.units.forEach(function(u){ uids[u.id]=1; });
      var addedU=0, dupU=0;
      (d.units||[]).forEach(function(u){ if(u&&u.id&&!uids[u.id]){ S.units.push(u); addedU++; } else dupU++; });
      var iids={}; S.imports.forEach(function(x){ iids[x.id]=1; });
      var addedI=0;
      (d.imports||[]).forEach(function(x){ if(x&&x.id&&!iids[x.id]){ S.imports.push(x); addedI++; } });
      /* 孩子模式进度：仅本地为空时采用备份的 */
      if(d.child){
        if(d.child.stars&&!S.child.stars) S.child.stars=d.child.stars;
        if(d.child.done&&!S.child.done) S.child.done=d.child.done;
      }
      save(); render(); closeDrawer();
      toast('导入完成：新增 '+addedU+' 个单元、'+addedI+' 条导入记录'+(dupU?('，跳过重复 '+dupU+' 个单元'):''));
    }catch(e){ toast('文件格式不对，请选择导出的 JSON 备份'); }
  };
  r.readAsText(file);
}

  /* 空闲预热浏览器 OCR 引擎：用户点「开始识别」时秒开（本地服务在线则自动跳过） */
  setTimeout(function(){ try{ ocrWarmup(); }catch(e){} },2600);
  render();
  renderChildStars();
}

init();
</script>
