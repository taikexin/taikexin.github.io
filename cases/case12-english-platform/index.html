<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2F5D4C">
<title>佳萱的英语学习平台</title>
<!-- 本工作台通过 WorkBuddy 资料库能力（library skill）搭建、存储和部署 -->
<style>
:root{
  --bg:#FBF6EC; --surface:#FFFFFF; --surface2:#F4EEDF; --surface3:#EDE5D1;
  --ink:#2A362F; --ink2:#5F7268; --ink3:#9AA89F;
  --green:#2E8B63; --green2:#37A473; --green3:#1F6E4D; --green100:#DFF3E9; --green50:#EFF9F3;
  --coral:#FF8A5C; --coral100:#FFE7DB; --coral50:#FFF4EE;
  --yellow:#F5B93C; --yellow100:#FDF1D3;
  --red:#E0564A; --red100:#FDE4E0;
  --blue:#5AA7D6; --blue100:#E5F1FA;
  --pink:#F4A9A0; --pink100:#FDEBEA;
  --mint:#6FBF9F;
  --line:#EBDCC2; --line2:#F3EDDE;
  --r:18px; --r2:12px;
  --serif:Georgia,"Times New Roman","Songti SC","SimSun",serif;
  --sans:"Yuanti SC","YouYuan","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --shadow:0 2px 10px rgba(126,158,120,.10);
  --shadow-lg:0 10px 30px rgba(126,158,120,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:
  radial-gradient(circle at 12px 12px, rgba(245,185,60,.16) 2.5px, transparent 3.6px) 0 0/46px 46px,
  radial-gradient(circle at 35px 35px, rgba(46,139,99,.10) 2.5px, transparent 3.6px) 0 0/46px 46px,
  linear-gradient(180deg,#FCF8EF 0%,#FAF4E7 100%);
  color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--ink);border:1px solid var(--line);border-radius:var(--r2);padding:9px 12px;background:var(--surface);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--green)}
textarea{resize:vertical;line-height:1.6}
a{color:var(--green2);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#C9C2B1;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
.ic{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
.ic.sm{width:15px;height:15px}.ic.lg{width:22px;height:22px}
.hide{display:none!important}
.shell{display:grid;grid-template-columns:228px 1fr;min-height:100vh}
.sidebar{background:linear-gradient(180deg,#FFFFFF 0%,#F5FAF6 100%);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:40}
.brand{display:flex;gap:10px;align-items:center;padding:18px 18px 14px;border-bottom:1px solid var(--line2)}
.brand-logo{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,var(--green),var(--mint));display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 4px 10px rgba(46,139,99,.3)}
.brand-name{font-weight:700;font-size:15px;letter-spacing:.2px}
.brand-sub{font-size:11px;color:var(--coral);margin-top:1px;font-style:italic}
.nav{padding:10px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:13px;color:var(--ink2);font-weight:500;font-size:14px;text-align:left;transition:background .15s}
.nav-item:hover{background:var(--surface2)}
.nav-item.active{background:linear-gradient(135deg,var(--green50),var(--green100));color:var(--green3);font-weight:600;box-shadow:inset 0 0 0 1.5px var(--green100)}
.nav-item .badge{margin-left:auto;background:var(--coral);color:#fff;font-size:11px;font-weight:700;border-radius:20px;padding:1px 7px}
.side-foot{padding:12px 18px;border-top:1px solid var(--line2);color:var(--ink3);font-size:11px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:rgba(251,246,236,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 26px;display:flex;align-items:center;gap:14px}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:linear-gradient(90deg,var(--green),var(--mint),var(--yellow),var(--coral),var(--blue),var(--green))}
.topbar .crumb{font-weight:700;font-size:17px;color:var(--green3)}
.topbar .crumb-en{font-family:var(--serif);font-style:italic;color:var(--coral);font-size:12px;font-weight:400}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.sync{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);background:var(--surface);border:1px solid var(--line);padding:6px 11px;border-radius:20px}
.sync .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green100)}
.content{padding:24px 26px 80px;max-width:1180px;width:100%;margin:0 auto}
.page{display:none;animation:fade .25s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:14px;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);transition:all .16s;min-height:42px}
.btn:hover{border-color:var(--mint);transform:translateY(-1px);box-shadow:var(--shadow)}
.btn:active{transform:translateY(1px) scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(46,139,99,.28)}
.btn.primary:hover{background:linear-gradient(135deg,var(--green2),var(--mint));box-shadow:0 6px 16px rgba(46,139,99,.34)}
.btn.coral{background:linear-gradient(135deg,#FF9A70,#FF7A4D);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(255,122,77,.30)}
.btn.coral:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--surface2);color:var(--ink);box-shadow:none;transform:none}
.btn.sm{padding:5px 11px;min-height:34px;font-size:13px;border-radius:11px}
.btn.lg{min-height:50px;padding:12px 22px;font-size:16px;border-radius:16px}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.card-pad{padding:18px}
.section-title{font-size:13px;font-weight:700;color:var(--green3);letter-spacing:.4px;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.section-title .en{font-family:var(--serif);font-style:italic;text-transform:none;letter-spacing:0;color:var(--coral);font-size:12px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2.5px 9px;border-radius:20px;border:1px solid var(--line);color:var(--ink2);background:var(--surface)}
.tag.green{background:var(--green100);color:var(--green3);border-color:transparent}
.tag.coral{background:var(--coral100);color:var(--coral);border-color:transparent}
.tag.yellow{background:var(--yellow100);color:#9A6B14;border-color:transparent}
.tag.blue{background:var(--blue100);color:var(--blue);border-color:transparent}
.tag.red{background:var(--red100);color:var(--red);border-color:transparent}
.tag.gray{background:var(--surface2);color:var(--ink3)}
.empty{padding:42px 20px;text-align:center;color:var(--ink3)}
.empty .ic{width:34px;height:34px;opacity:.4;margin-bottom:8px}
.empty b{color:var(--green2)}
.muted{color:var(--ink3);font-size:12px}
.en-text{font-family:var(--serif)}
/* 词根拆解胶囊（分音节朗读 UI） */
.wd{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px;cursor:pointer;vertical-align:middle;line-height:1.2}
.wd-part{display:inline-flex;align-items:baseline;gap:3px;padding:3px 9px;border-radius:10px;background:var(--green50);border:1px solid var(--green100);color:var(--green3);font-family:var(--serif);font-size:15px;font-weight:600;transition:all .18s;position:relative}
.wd-part:hover{background:var(--green100);transform:translateY(-1px)}
.wd-part i{font-style:normal;font-family:var(--sans);font-size:10px;font-weight:500;color:var(--green2);opacity:.85;line-height:1;align-self:center}
.wd-part.stress{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 2px 6px rgba(47,93,76,.28);font-weight:800}
.wd-part.stress i{color:rgba(255,255,255,.85)}
.wd-part.hasmean{background:var(--yellow100);border-color:#EDD9A8;color:#7A5710}
.wd-part.hasmean.stress{background:var(--green);border-color:var(--green);color:#fff}
.wd-part.hasmean.stress i{color:rgba(255,255,255,.85)}
.wd-part.playing{animation:wdPulse .5s ease}
.wd-part.quiet{background:transparent;border-color:transparent;color:var(--ink3);font-weight:500;cursor:default;padding-left:2px;padding-right:2px}
.wd-part.quiet:hover{background:transparent;transform:none}
@keyframes wdPulse{0%{transform:scale(1)}50%{transform:scale(1.16)}100%{transform:scale(1)}}
.wd-mean{margin-top:6px;display:flex;flex-wrap:wrap;align-items:center;gap:5px;font-size:11px;color:var(--ink3)}
.wd-mean-item{background:var(--surface2);border-radius:5px;padding:1.5px 7px;color:var(--ink2);font-weight:500}
.wd-plus{color:var(--ink3);font-size:10px}
.wd-actions{display:inline-flex;gap:6px;margin-left:8px;vertical-align:middle}
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:var(--r2);padding:11px 14px;font-size:13px;line-height:1.6}
.banner.green{background:var(--green50);color:var(--green3);border:1px solid var(--green100)}
.banner.coral{background:var(--coral50);color:#8A3B22;border:1px solid var(--coral100)}
.banner.yellow{background:var(--yellow100);color:#7A5710;border:1px solid #EDD9A8}
.banner .ic{flex:none;margin-top:1px}
.progress-track{height:8px;background:var(--surface2);border-radius:6px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--mint));border-radius:6px;transition:width .4s ease;position:relative}
.progress-fill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:shine 2.2s linear infinite}
@keyframes shine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.hero-card{background:linear-gradient(135deg,#3AA87A 0%,#2E8B63 55%,#4FB98C 100%);border:none;color:#fff;border-radius:22px;overflow:hidden;position:relative;box-shadow:0 12px 32px rgba(46,139,99,.28)}
.hero-card::before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.09);top:-70px;right:-40px}
.hero-card::after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.08);bottom:-30px;left:38%}
.hero-inner{padding:22px 24px;display:flex;gap:20px;align-items:center;position:relative;z-index:2}
.hero-cover{width:104px;height:140px;border-radius:14px;background:#fff;box-shadow:0 8px 22px rgba(0,0,0,.22);overflow:hidden;flex:none;position:relative}
.hero-cover img{width:100%;height:100%;object-fit:cover;display:block}
.hero-cover .ph{width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(160deg,var(--yellow100),var(--green100));color:var(--green3);font-family:var(--serif);font-style:italic;font-size:15px;text-align:center;padding:8px}
.hero-body{flex:1;min-width:0}
.hero-kicker{font-size:12px;letter-spacing:1.5px;color:rgba(255,255,255,.8);display:flex;gap:10px;align-items:center;margin-bottom:7px}
.hero-kicker::before{content:"✦";color:var(--yellow);letter-spacing:0}
.hero-title{font-size:21px;font-weight:700;line-height:1.3;font-family:var(--serif)}
.hero-meta{display:flex;gap:16px;margin-top:10px;color:rgba(255,255,255,.88);font-size:13px;flex-wrap:wrap}
.hero-meta span{display:inline-flex;gap:6px;align-items:center}
.hero-actions{margin-top:15px;display:flex;gap:10px;flex-wrap:wrap}
.hero-actions .btn{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.35)}
.hero-actions .btn.primary{background:#fff;color:var(--green3);border-color:#fff;font-weight:700}
.hero-deco{position:absolute;right:-30px;bottom:-40px;font-family:var(--serif);font-style:italic;font-size:120px;color:rgba(255,255,255,.08);line-height:1;user-select:none}
.today-grid{display:grid;grid-template-columns:1fr 320px;gap:16px}
.today-grid .col{display:flex;flex-direction:column;gap:16px;min-width:0}
.todo-row{display:flex;align-items:center;gap:12px;padding:11px 6px;border-bottom:1px solid var(--line2)}
.todo-row:last-child{border-bottom:none}
.check{width:23px;height:23px;border-radius:50%;border:2px solid var(--mint);display:grid;place-items:center;flex:none;cursor:pointer;background:var(--surface);transition:all .15s}
.check svg{opacity:0;width:13px;height:13px;stroke:#fff;stroke-width:3.2;fill:none}
.check.done{background:linear-gradient(135deg,var(--green),var(--green2));border-color:transparent}
.check.done svg{opacity:1;animation:popIn .25s ease}
@keyframes popIn{0%{transform:scale(.4)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.check.late{border-color:var(--coral);background:var(--coral50)}
.todo-main{flex:1;min-width:0}
.todo-title{font-weight:600;font-size:14px}
.todo-title.late{color:var(--red)}
.todo-sub{font-size:12px;color:var(--ink3);margin-top:1px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.todo-sub .tag{font-size:11px;padding:1px 8px}
.todo-actions{display:flex;gap:6px;flex:none}
.stat-row{display:flex;gap:14px;align-items:center}
.ring-wrap{position:relative;width:74px;height:74px;flex:none}
.ring-wrap svg{width:74px;height:74px;transform:rotate(-90deg)}
.ring-center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring-center b{font-size:17px;line-height:1}
.ring-center small{font-size:10px;color:var(--ink3)}
.stat-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.stat-mini{background:linear-gradient(135deg,var(--surface),var(--green50));border:1px solid var(--green100);border-radius:var(--r2);padding:11px 13px}
.stat-mini .k{font-size:11px;color:var(--ink2)}
.stat-mini .v{font-size:19px;font-weight:700;color:var(--green3);margin-top:2px;display:flex;align-items:baseline;gap:4px}
.stat-mini .v small{font-size:11px;color:var(--ink3);font-weight:400}
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:10px 4px 10px 14px}
.tl-item::before{content:"";position:absolute;left:-20px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2.5px solid var(--ink3)}
.tl-item.done::before{background:var(--green);border-color:var(--green)}
.tl-item.now::before{background:var(--coral);border-color:var(--coral)}
.tl-item .tl-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.tl-item .tl-title{font-weight:600}
.tl-item .tl-meta{font-size:12px;color:var(--ink3);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.tl-bar{height:5px;border-radius:4px;background:var(--surface2);margin-top:7px;overflow:hidden;max-width:300px}
.tl-bar i{display:block;height:100%;background:var(--green);border-radius:4px}
.parent-card{position:relative;background:linear-gradient(135deg,var(--yellow100),#FFF6E0);border-color:#F0D9A0;border-radius:20px}
.parent-card .q{font-family:var(--serif);font-size:17px;font-weight:600;color:#5E440B;line-height:1.4}
.parent-card .a{font-family:var(--serif);font-size:14px;color:#7A5C1E;margin-top:6px;font-style:italic}
.parent-card::before{content:"✦";position:absolute;top:12px;right:14px;color:var(--yellow);font-size:16px}
.todo-section-title{font-size:13px;font-weight:700;color:var(--ink2);margin:16px 0 6px;display:flex;align-items:center;gap:8px}
.todo-section-title .n{background:var(--coral);color:#fff;font-size:11px;border-radius:20px;padding:1px 8px;font-weight:700}
.lib-grid{display:grid;grid-template-columns:225px 1fr 380px;gap:14px;align-items:start}
.lib-filter{position:sticky;top:74px}
.lib-group{margin-bottom:16px}
.lib-group .g-title{font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.8px;margin-bottom:7px}
.chip{display:flex;align-items:center;gap:8px;width:100%;padding:7px 12px;border-radius:11px;font-size:13px;color:var(--ink2);text-align:left;margin-bottom:3px;transition:background .12s}
.chip:hover{background:var(--surface2)}
.chip.on{background:linear-gradient(135deg,var(--green50),var(--green100));color:var(--green3);font-weight:600}
.chip .cnt{margin-left:auto;font-size:11px;color:var(--ink3);background:var(--surface2);border-radius:10px;padding:0 7px}
.chip.on .cnt{background:var(--green100)}
.search-box{position:relative;margin-bottom:12px}
.search-box .ic{position:absolute;left:12px;top:11px;color:var(--ink3)}
.search-box input{padding-left:37px;width:100%}
.lib-list{min-width:0}
.lib-item{display:block;width:100%;text-align:left;padding:13px 15px;border-bottom:1px solid var(--line2);transition:background .12s;cursor:pointer}
.lib-item:hover{background:var(--green50)}
.lib-item.sel{background:linear-gradient(135deg,var(--green50),var(--green100));box-shadow:inset 3px 0 0 var(--green)}
.lib-item .li-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lib-item .li-title{font-weight:600;font-size:14px}
.lib-item .li-meta{font-size:12px;color:var(--ink3);margin-top:3px;display:flex;gap:12px;flex-wrap:wrap}
.type-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px}
.tp-vocab{background:var(--green100);color:var(--green3)}
.tp-sentence{background:var(--blue100);color:var(--blue)}
.tp-book{background:var(--yellow100);color:#9A6B14}
.tp-video{background:var(--coral100);color:var(--coral)}
.tp-file{background:var(--surface2);color:var(--ink2)}
.tp-notice{background:var(--red100);color:var(--red)}
.lib-detail{position:sticky;top:74px;max-height:calc(100vh - 92px);overflow-y:auto}
.word-row{display:flex;align-items:center;gap:10px;padding:8px 10px;background:linear-gradient(135deg,var(--surface),var(--green50));border:1px solid var(--green100);border-radius:14px;margin-bottom:6px;transition:border-color .15s}
.word-row:hover{border-color:var(--mint)}
.word-row .en{font-family:var(--serif);font-weight:700;font-size:15px;min-width:96px}
.word-row .en-col{display:flex;flex-direction:column;gap:2px;min-width:130px;flex:none;max-width:46%}
.word-row .en-col .wd-mean{margin-top:0}
.word-row .zh{font-size:13px;color:var(--ink2);flex:1}
.word-mastery{display:flex;align-items:center;gap:6px;flex:none}
.word-mastery .m-bar{width:52px;height:5px;background:var(--surface2);border-radius:4px;overflow:hidden}
.word-mastery .m-bar i{display:block;height:100%;background:var(--green)}
.word-mastery .m-txt{font-size:11px;color:var(--ink3);width:26px;text-align:right}
.res-card{display:flex;gap:11px;padding:10px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;align-items:center;transition:border-color .15s}
.res-card:hover{border-color:var(--mint)}
.res-card .thumb{width:64px;height:64px;border-radius:12px;overflow:hidden;background:var(--surface2);flex:none;position:relative}
.res-card .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.res-card .thumb .play{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.25);color:#fff}
.res-card .r-info{flex:1;min-width:0}
.res-card .r-title{font-weight:600;font-size:13.5px;display:flex;gap:6px;align-items:center}
.res-card .r-meta{font-size:11.5px;color:var(--ink3);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.res-card .r-act{display:flex;gap:5px;flex:none}
.unit-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.unit-head .uh-title{font-size:21px;font-weight:700;font-family:var(--serif);line-height:1.3}
.unit-head .uh-sub{color:var(--ink2);margin-top:5px;display:flex;gap:12px;flex-wrap:wrap;font-size:13px}
.unit-sec{margin-top:18px}
.unit-sec .us-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.unit-sec .us-title .en{font-family:var(--serif);font-style:italic;color:var(--ink3);font-weight:400;font-size:12px}
.raw-box{background:var(--surface2);border-radius:14px;padding:14px;font-size:13px;white-space:pre-wrap;line-height:1.75;max-height:340px;overflow-y:auto}
.raw-img{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:10px}
.raw-img img{width:100%;border-radius:12px;border:1px solid var(--line);cursor:zoom-in;transition:transform .15s}
.raw-img img:hover{transform:scale(1.03)}
.uncertain-tag{display:inline-flex;gap:4px;align-items:center;font-size:11px;font-weight:700;color:#9A6B14;background:var(--yellow100);border:1px dashed #D8BC7E;border-radius:6px;padding:1px 7px}
.sentence-line{padding:10px 12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:var(--surface);transition:border-color .15s}
.sentence-line:hover{border-color:var(--mint)}
.sentence-line .s-en{font-family:var(--serif);font-size:15px;font-weight:600}
.sentence-line .s-en mark{background:var(--yellow100);border-radius:3px;padding:0 3px;color:#7A5710}
.sentence-line .s-zh{font-size:13px;color:var(--ink2);margin-top:4px}
.import-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.import-tab{padding:10px 16px;font-weight:600;font-size:14px;color:var(--ink2);border-bottom:3px solid transparent;white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.import-tab.on{color:var(--green3);border-bottom-color:var(--coral)}
.dropzone{border:2px dashed var(--mint);border-radius:20px;padding:34px 20px;text-align:center;color:var(--ink2);transition:all .15s;background:var(--surface);cursor:pointer}
.dropzone:hover,.dropzone.over{border-color:var(--green);background:var(--green50);color:var(--green3)}
.dropzone .ic{width:38px;height:38px;margin-bottom:8px;opacity:.55}
.paste-area{width:100%;min-height:190px;border-radius:16px;padding:15px;border:2px solid var(--line);font-size:14px;background:var(--surface)}
.paste-area:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green100)}
.parse-preview{border:1px solid var(--line);border-radius:var(--r2);background:var(--surface);margin-top:16px;overflow:hidden}
.pp-head{display:flex;align-items:center;gap:9px;padding:11px 15px;background:var(--green50);border-bottom:1px solid var(--line);font-weight:700;font-size:13.5px;color:var(--green3)}
.pp-body{padding:15px;max-height:460px;overflow-y:auto}
.field-edit{margin-bottom:13px}
.field-edit .fe-label{font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:5px;display:flex;gap:6px;align-items:center}
.field-edit input,.field-edit textarea{width:100%;font-size:14px}
.field-edit textarea{min-height:64px}
.word-edit-row{display:flex;gap:7px;margin-bottom:7px;align-items:center}
.word-edit-row input{flex:1;padding:7px 10px;font-size:14px}
.word-edit-row .en{font-family:var(--serif);font-weight:700}
.imp-log-item{padding:13px 15px;border:1px solid var(--line);border-radius:14px;margin-bottom:9px;background:var(--surface);transition:border-color .15s}
.imp-log-item:hover{border-color:var(--mint)}
.imp-log-item .il-top{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.imp-log-item .il-title{font-weight:600}
.imp-log-item .il-meta{font-size:12px;color:var(--ink3);margin-top:4px;display:flex;gap:14px;flex-wrap:wrap}
.imp-log-item .il-actions{margin-top:9px;display:flex;gap:7px;flex-wrap:wrap}
.practice-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.game-wrap{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;flex-direction:column}
.game-wrap.open{display:flex}
.game-top{padding:13px 20px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:12px}
.game-top .g-title{font-weight:700;font-size:16px}
.game-body{flex:1;overflow-y:auto;padding:26px 20px 40px;max-width:720px;width:100%;margin:0 auto}
.game-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.match-cols{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.match-card{padding:14px;border:2px solid var(--line);border-radius:16px;text-align:center;font-size:16px;font-weight:600;cursor:pointer;background:var(--surface);transition:all .15s;min-height:56px;display:grid;place-items:center}
.match-card:hover{border-color:var(--mint);transform:translateY(-2px)}
.match-card.sel{border-color:var(--green);background:var(--green50);box-shadow:0 0 0 3px var(--green100)}
.match-card.ok{border-color:var(--green);background:var(--green100);color:var(--green3)}
.match-card.bad{border-color:var(--coral);background:var(--coral100);color:var(--red);animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.order-word{padding:11px 16px;border:2px solid var(--line);border-radius:14px;font-weight:600;font-size:15px;cursor:pointer;background:var(--surface);font-family:var(--serif);transition:all .15s}
.order-word:hover{border-color:var(--mint);transform:translateY(-2px)}
.order-word.used{opacity:.3;pointer-events:none}
.order-slot{flex:1;min-height:52px;border:2px dashed var(--mint);border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:16px;font-weight:600;background:var(--surface)}
.listen-big{width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--mint));color:#fff;display:grid;place-items:center;margin:6px auto 22px;cursor:pointer;box-shadow:0 10px 26px rgba(47,93,76,.35);transition:transform .12s}
.listen-big:hover{transform:scale(1.05)}
.listen-big:active{transform:scale(.94)}
.listen-big .ic{width:44px;height:44px}
.rec-dot{width:11px;height:11px;border-radius:50%;background:var(--coral);display:inline-block;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.star-line{display:flex;gap:5px;justify-content:center;margin:8px 0}
.star-line .ic{width:26px;height:26px;color:var(--yellow);fill:var(--yellow)}
.star-line .ic.off{color:var(--line);fill:var(--line)}
.pic-options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:430px;margin:18px auto 0}
.pic-option{padding:18px 10px;border:2px solid var(--line);border-radius:16px;font-family:var(--serif);font-size:18px;font-weight:700;background:var(--surface);cursor:pointer;transition:all .15s;min-height:70px}
.pic-option:hover{border-color:var(--mint);background:var(--green50);transform:translateY(-2px)}
.pic-option.ok{border-color:var(--green);background:var(--green100)}
.pic-option.bad{border-color:var(--coral);background:var(--coral100);animation:shake .3s}
.pic-art{width:170px;height:170px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;background:var(--yellow100);border:2px solid #EBD9AC;overflow:hidden}
.pic-art svg{width:120px;height:120px}
.wrong-list{display:flex;flex-direction:column;gap:8px}
.wrong-item{display:flex;align-items:center;gap:12px;padding:10px 13px;border:1px solid var(--line);border-radius:14px;background:var(--surface);transition:border-color .15s}
.wrong-item:hover{border-color:var(--coral)}
.wrong-item .en{font-family:var(--serif);font-weight:700;font-size:15px;width:110px}
.wrong-item .n{color:var(--coral);font-weight:700;font-size:13px}
.grow-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-cell{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;background:var(--surface);border:1px solid var(--line);color:var(--ink3);transition:all .15s}
.cal-cell:hover{border-color:var(--mint)}
.cal-cell.done{background:linear-gradient(135deg,var(--green50),var(--green100));color:var(--green3);border-color:transparent}
.cal-cell.today{background:linear-gradient(135deg,var(--green),var(--mint));color:#fff;font-weight:700;box-shadow:0 4px 10px rgba(46,139,99,.3)}
.cal-cell.has{border-color:var(--mint);background:linear-gradient(135deg,var(--green50),var(--green100))}
.cal-cell.sel{background:var(--green);color:#fff;border-color:var(--green);font-weight:700;box-shadow:0 4px 10px rgba(46,139,99,.3)}
.cal-cell.sel .tag2{color:#fff;background:rgba(255,255,255,.22);border-radius:8px;padding:1px 5px}
.cal-cell .n{font-weight:600}
.cal-cell .tag2{font-size:8px;line-height:1;margin-top:2px;opacity:.75}
.bar-chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding:8px 4px 0}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar-col .bar{width:70%;max-width:40px;background:var(--green100);border-radius:5px 5px 2px 2px;position:relative;transition:height .5s}
.bar-col .bar i{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--ink2);white-space:nowrap}
.bar-col .lbl{font-size:10.5px;color:var(--ink3)}
.bar-col.today .bar{background:var(--green)}
.line-chart{position:relative;padding:8px 4px 0}
.axis-lines{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.axis-lines span{border-top:1px dashed var(--line)}
.summary-card{background:linear-gradient(135deg,#FDF3DC,#FBF0D0);border:1px solid #F0D9A0;border-radius:20px;padding:20px;box-shadow:0 6px 18px rgba(200,160,60,.14)}
.summary-card .sc-title{font-size:12px;font-weight:700;color:#9A6B14;letter-spacing:1px;margin-bottom:10px;display:flex;gap:7px;align-items:center}
.summary-card p{font-size:14.5px;line-height:1.85;color:#5E440B}
.summary-card .en{font-family:var(--serif);font-style:italic}
.child-wrap{position:fixed;inset:0;background:
  radial-gradient(circle at 12px 12px, rgba(245,185,60,.20) 2.5px, transparent 3.6px) 0 0/46px 46px,
  radial-gradient(circle at 35px 35px, rgba(46,139,99,.12) 2.5px, transparent 3.6px) 0 0/46px 46px,
  linear-gradient(180deg,#FFFBEF 0%,#FDF5E3 100%);
  z-index:120;display:none;flex-direction:column}
.child-wrap.open{display:flex}
.child-top{padding:14px 18px;display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#2E8B63,#4FB98C);color:#fff}
.child-top .ct-title{font-weight:700;font-size:17px;display:flex;gap:9px;align-items:center}
.child-top .ct-exit{margin-left:auto;background:rgba(255,255,255,.18);color:#fff;border-radius:14px;min-height:50px;padding:0 18px;font-size:16px;font-weight:700;display:flex;gap:8px;align-items:center}
.child-stars{margin-left:auto;display:flex;gap:4px;align-items:center;background:rgba(255,255,255,.18);padding:7px 14px;border-radius:20px;font-weight:700}
.child-body{flex:1;overflow-y:auto;padding:20px 16px 40px;max-width:760px;width:100%;margin:0 auto}
.child-card{background:#fff;border-radius:26px;border:3px solid var(--yellow100);box-shadow:0 8px 24px rgba(200,160,60,.14);padding:22px;margin-bottom:16px;transition:transform .18s,box-shadow .18s}
.child-card:hover{transform:translateY(-2px)}
.child-card:nth-of-type(3n+1){border-color:var(--green100)}
.child-card:nth-of-type(3n+2){border-color:var(--pink100)}
.child-card-title{font-size:16px;font-weight:700;color:var(--green3);display:flex;gap:8px;align-items:center;margin-bottom:13px}
.child-card-title .en{font-family:var(--serif);font-style:italic;color:var(--coral)}
.big-btn{width:100%;min-height:58px;border-radius:18px;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:11px;background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;margin-bottom:10px;box-shadow:0 5px 14px rgba(46,139,99,.24);transition:transform .15s}
.big-btn:hover{transform:translateY(-2px)}
.big-btn:active{transform:scale(.97)}
.big-btn.coral{background:linear-gradient(135deg,#FF9A70,#FF7A4D);box-shadow:0 5px 14px rgba(255,122,77,.26)}
.big-btn.yellow{background:linear-gradient(135deg,#FFCE5C,#F5B93C);color:#6B4A08;box-shadow:0 5px 14px rgba(245,185,60,.30)}
.big-btn.done{background:linear-gradient(135deg,var(--green100),var(--green50));color:var(--green3);box-shadow:none}
.big-btn .ic{width:24px;height:24px}
.flash{position:relative;width:100%;max-width:300px;margin:0 auto;aspect-ratio:4/5;perspective:1000px;cursor:pointer}
.flash-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s}
.flash.flip .flash-inner{transform:rotateY(180deg)}
.flash-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:3px solid var(--green100)}
.flash-face.front{background:#fff}
.flash-face.back{background:var(--green);color:#fff;transform:rotateY(180deg)}
.flash .f-en{font-family:var(--serif);font-size:34px;font-weight:700}
.flash .f-hint{font-size:14px;color:var(--ink3)}
.flash .f-zh{font-size:26px;font-weight:700}
.flash .f-voice{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--mint));display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px rgba(46,139,99,.3)}
.flash.back .f-voice{background:rgba(255,255,255,.2);color:#fff}
.child-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.child-pic{width:150px;height:150px;margin:0 auto 8px;border-radius:50%;background:linear-gradient(160deg,var(--green50),var(--yellow100));border:3px solid var(--green100);display:grid;place-items:center;overflow:hidden}
.child-pic svg{width:100px;height:100px}
.child-quote{text-align:center;font-size:17px;font-weight:700;color:var(--green3);font-family:var(--serif);margin:8px 0 2px}
.child-zh{text-align:center;color:var(--ink2);font-size:14px}
.celebrate{position:fixed;inset:0;pointer-events:none;z-index:130;overflow:hidden}
.celebrate span{position:absolute;font-family:var(--serif);font-weight:700;animation:fall 2.6s linear forwards}
@keyframes fall{0%{transform:translateY(-30px) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(320deg);opacity:.15}}
.drawer-mask{position:fixed;inset:0;background:rgba(36,48,43,.38);z-index:110;display:none;align-items:flex-end;justify-content:flex-end}
.drawer-mask.open{display:flex}
.drawer{width:min(430px,100vw);height:100vh;background:var(--surface);padding:22px;overflow-y:auto;animation:slideIn .25s ease;border-left:4px solid var(--yellow)}
@keyframes slideIn{from{transform:translateX(60px);opacity:0}to{transform:none;opacity:1}}
.modal-mask{position:fixed;inset:0;background:rgba(36,48,43,.45);z-index:115;display:none;align-items:center;justify-content:center;padding:20px}
.modal-mask.open{display:flex}
.modal{background:var(--surface);border-radius:22px;max-width:500px;width:100%;padding:22px;max-height:88vh;overflow-y:auto;animation:fade .2s ease;box-shadow:0 20px 50px rgba(70,100,80,.25)}
.modal .m-title{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:9px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.field input,.field textarea,.field select{width:100%}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line2)}
.settings-row:last-child{border-bottom:none}
.settings-row .s-k{font-size:14px;font-weight:600}
.settings-row .s-d{font-size:12px;color:var(--ink3);margin-top:2px}
.switch{width:44px;height:25px;border-radius:14px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .18s}
.switch::after{content:"";position:absolute;width:21px;height:21px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .18s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--green)}
.switch.on::after{left:21px}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:18px;font-size:14px;z-index:200;opacity:0;transition:all .25s;pointer-events:none;box-shadow:0 8px 26px rgba(0,0,0,.25);max-width:86vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.lightbox{position:fixed;inset:0;background:rgba(20,26,23,.86);z-index:140;display:none;align-items:center;justify-content:center;padding:30px;cursor:zoom-out}
.lightbox.open{display:flex}
.lightbox img{max-width:92vw;max-height:88vh;border-radius:10px}
.mobile-nav{display:none}
@media (max-width:1024px){ .lib-grid{grid-template-columns:1fr} .lib-detail{position:static;max-height:none} .lib-filter{position:static} }
@media (max-width:960px){ .today-grid,.practice-grid,.grow-grid{grid-template-columns:1fr} }
@media (max-width:768px){
  .shell{grid-template-columns:1fr;padding-bottom:64px}
  .sidebar{display:none}
  .mobile-nav{display:flex;position:fixed;left:0;right:0;bottom:0;height:62px;background:var(--surface);border-top:1px solid var(--line);z-index:90;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -6px 20px rgba(126,158,120,.14)}
  .mobile-nav::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--green),var(--mint),var(--yellow),var(--coral),var(--blue),var(--green))}
  .mobile-nav .m-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:var(--ink3);font-weight:700}
  .mobile-nav .m-item.active{color:var(--green3)}
  .mobile-nav .m-item .ic{width:21px;height:21px}
  .mobile-nav .m-item.active .ic{background:var(--green100);border-radius:12px;padding:4px;width:28px;height:28px}
  .content{padding:16px 14px 30px}
  .topbar{padding:11px 14px;flex-wrap:wrap}
  .hero-inner{flex-direction:column;align-items:flex-start}
  .hero-cover{width:90px;height:122px}
  .hero-title{font-size:18px}
  .hero-deco{display:none}
  .btn{min-height:46px}
  .match-cols{gap:12px}
  .stat-cols{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo" id="brandLogo"></div>
      <div>
        <div class="brand-name">佳萱的英语学习平台</div>
        <div class="brand-sub">Jiaxuan's English Studio</div>
      </div>
    </div>
    <nav class="nav" id="navSide"></nav>
    <div class="side-foot" id="sideDataStat">数据保存在本机浏览器</div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div>
        <div class="crumb" id="crumbTitle">今日学习</div>
        <div class="crumb-en" id="crumbEn">Today</div>
      </div>
      <div class="topbar-right">
        <div class="sync" id="syncBadge"><span class="dot"></span><span id="syncText">本地已保存</span></div>
        <button class="btn primary sm" onclick="navTo('import')" style="min-height:38px"><span data-ic="plus"></span>导入课程</button>
        <button class="btn coral sm" onclick="enterChildMode()" style="min-height:38px"><span data-ic="sparkles"></span>孩子模式</button>
      </div>
    </header>
    <main class="content">
      <section class="page" id="page-today"></section>
      <section class="page" id="page-library"></section>
      <section class="page" id="page-archive"></section>
      <section class="page" id="page-unit"></section>
      <section class="page" id="page-practice"></section>
      <section class="page" id="page-growth"></section>
      <section class="page" id="page-import"></section>
    </main>
  </div>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>
<div class="drawer-mask" id="drawerMask">
  <div class="drawer">
    <div style="display:flex;align-items:center;gap:9px;margin-bottom:18px">
      <div class="brand-logo" style="width:34px;height:34px;border-radius:9px" id="drawerLogo"></div>
      <div>
        <div style="font-weight:700;font-size:15px">设置与备份</div>
        <div class="muted" style="font-size:11px">Settings</div>
      </div>
      <button class="btn ghost sm" style="margin-left:auto;min-height:36px" onclick="closeDrawer()"><span data-ic="x"></span></button>
    </div>
    <div id="settingsBody"></div>
  </div>
</div>
<div class="game-wrap" id="gameWrap">
  <div class="game-top">
    <button class="btn sm" onclick="closeGame()" style="min-height:40px"><span data-ic="chevron-left"></span>返回</button>
    <div class="g-title" id="gameTitle">练习</div>
    <div style="margin-left:auto;font-weight:700;color:var(--green3)" id="gameScore"></div>
  </div>

/* ============ 语音引擎 v4：三级通道（网络 TTS → 本机语音 → 明确提示） ============ */
/* 为什么 v4：在 iframe / 微信内置浏览器中，speechSynthesis 与 new Audio() 都可能被静默禁用或请求挂起，
   造成「点击没声音且没有任何提示」。v4 修复：
   ① 复用挂到 DOM 的 <audio> 元素播放（比 new Audio() 稳定）；
   ② 每次播放带 9 秒硬超时，请求挂起绝不静默卡死；
   ③ 三种模式：auto 自动(默认，网络→本机→提示) / net 仅网络 / local 仅本机；
   ④ 自动声音自检，设置页如实显示「朗读引擎状态」；
   ⑤ 全部失败时 toast 明确告诉用户如何打开声音。 */
var VOICES=[];
function refreshVoices(){
  try{ VOICES=(window.speechSynthesis?speechSynthesis.getVoices():[])||[]; }catch(e){ VOICES=[]; }
  return VOICES;
}
function bestVoice(){
  refreshVoices();
  var en=VOICES.filter(function(x){ return /en/i.test(x.lang||''); });
  var us=en.filter(function(x){ return /en[-_]US/i.test(x.lang||''); });
  var pool=us.length?us:en;
  var prefs=[/Google US English/i,/Microsoft Aria/i,/Microsoft Jenny/i,/Microsoft Michelle/i,/Microsoft Ava/i,/Microsoft Zira/i,/Natural/i,/Samantha/i,/female/i];
  for(var i=0;i<prefs.length;i++){ var v=pool.find(function(x){ return prefs[i].test(x.name||''); }); if(v) return v; }
  return pool[0]||null;
}
if('speechSynthesis' in window){
  refreshVoices();
  speechSynthesis.onvoiceschanged=function(){ refreshVoices(); };
}
/* 语音模式：auto=自动(默认，最稳) · net=仅网络语音 · local=仅本机语音 */
function voiceMode(){ try{ return (S&&S.settings&&S.settings.voiceMode)||'auto'; }catch(e){ return 'auto'; } }
/* 共享播放器：一个隐藏 <audio> 元素挂到 DOM，跨环境最稳 */
var AUDIO_EL=null, AUDIO_TIMER=null;
function audioEl(){
  if(!AUDIO_EL){
    try{
      AUDIO_EL=document.createElement('audio');
      AUDIO_EL.referrerPolicy='no-referrer';   /* 关键：不发送 Referer，百度接口才放行 */
      AUDIO_EL.preload='auto';
      AUDIO_EL.style.display='none';
      AUDIO_EL.setAttribute('playsinline','');
      AUDIO_EL.muted=false;
      document.body.appendChild(AUDIO_EL);
    }catch(e){ AUDIO_EL=null; }
  }
  return AUDIO_EL;
}
/* 网络 TTS 地址：英文单词→有道词典音（不校验来源）；句子/中文→百度翻译音（需 no-referrer） */
function ttsNetUrl(text,lang){
  var t=String(text==null?'':text).trim(); if(!t) return '';
  if(lang&&String(lang).indexOf('zh')===0) return 'https://fanyi.baidu.com/gettts?lan=zh&text='+encodeURIComponent(t)+'&spd=3&source=web';
  if(/^[a-zA-Z'][a-zA-Z'\-]*$/.test(t)) return 'https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(t)+'&type=2';
  return 'https://fanyi.baidu.com/gettts?lan=en&text='+encodeURIComponent(t)+'&spd=3&source=web';
}
/* 播放一段网络音频；onend(ok,err)：ok=true 正常播完；false 时 err 说明原因
   err: 'policy' 浏览器自动播放策略拦截 / 'timeout' 请求超时 / 'error' 加载失败 / 'empty' 无文本 */
function netSpeak(text,lang,onend,vol){
  var url=ttsNetUrl(text,lang);
  if(!url){ if(onend) onend(false,'empty'); return; }
  var a;
  try{ a=audioEl(); }catch(e){ if(onend) onend(false,'error'); return; }
  if(!a){ if(onend) onend(false,'error'); return; }
  if(AUDIO_TIMER){ clearTimeout(AUDIO_TIMER); AUDIO_TIMER=null; }
  var fired=false;
  var fin=function(ok,err){
    if(fired) return; fired=true;
    if(AUDIO_TIMER){ clearTimeout(AUDIO_TIMER); AUDIO_TIMER=null; }
    if(onend) onend(ok,err);
  };
  /* 硬超时：请求挂起/被墙/被拦截时绝不静默卡死，9 秒后按失败处理 */
  AUDIO_TIMER=setTimeout(function(){ try{ a.pause(); a.removeAttribute('src'); }catch(e){} fin(false,'timeout'); },9000);
  try{
    a.volume=(vol==null?1:Math.max(0,Math.min(1,vol)));
    a.onended=function(){ fin(true); };
    a.onerror=function(){ fin(false,'error'); };
    a.onstalled=function(){ /* 等待超时兜底 */ };
    a.src=url;
    var p=a.play();
    if(p&&p.catch) p.catch(function(e){
      var name=String((e&&e.name)||'');
      fin(false,/NotAllowed|Abort|autoplay|interrupted/i.test(name)?'policy':'error');
    });
  }catch(e){ fin(false,'error'); }
}
/* 本机 speechSynthesis 朗读（网络不通/离线时兜底） */
function speakLocal(text,lang,rate,pitch,cb){
  try{
    if(!('speechSynthesis' in window)){ if(cb) cb(); return; }
    try{ speechSynthesis.cancel(); }catch(e){}
    var u=new SpeechSynthesisUtterance(String(text));
    u.lang=lang||'en-US'; u.rate=rate||0.85; u.pitch=(pitch==null?1.05:pitch);
    var v=bestVoice();
    if(v){ u.voice=v; if(!lang||/^en/i.test(lang)) u.lang=v.lang||'en-US'; }
    u.onend=function(){ if(cb) cb(); };
    u.onerror=function(){ if(cb) cb(); };
    /* Chrome 连续播放 bug：cancel 后立即 speak 可能无声，延迟 60ms */
    setTimeout(function(){ try{ speechSynthesis.speak(u); }catch(e){ if(cb) cb(); } },60);
  }catch(e){ if(cb) cb(); }
}
/* 语音自检结果：'net' 网络可用 / 'local' 仅本机 / 'none' 都不行 / 'unknown' 未检测 */
var AUDIO_STATE='unknown';
function ttsProbe(){
  if(AUDIO_STATE!=='unknown') return AUDIO_STATE;
  try{
    netSpeak('a','en',function(ok){
      if(ok) AUDIO_STATE='net';
      else if('speechSynthesis' in window) AUDIO_STATE='local';
      else AUDIO_STATE='none';
    },0.0001); /* 近乎无声自检：能走完 onended 即说明网络通道可用 */
  }catch(e){ AUDIO_STATE='none'; }
  return AUDIO_STATE;
}
/* 失败提示（轻量防刷屏：6 秒内只提示一次） */
var FAIL_HINT_AT=0;
function sayFailHint(extra){
  var now=Date.now();
  if(now-FAIL_HINT_AT<6000) return;
  FAIL_HINT_AT=now;
  var msg=extra||('当前环境无法播放声音：网络语音与本机语音都被浏览器拦截。\n请试试：① 用手机/电脑的「浏览器」（不要在微信内）打开本页；② 点地址栏的声音图标取消静音。');
  try{ if(window.toast) toast(msg); else alert(msg); }catch(e){}
}
/* 主入口 speak：auto(默认) 网络→本机→提示；net 仅网络；local 仅本机 */
function speak(text,lang,rate,pitch,cb){
  var t=String(text==null?'':text);
  if(!t){ if(cb) cb(); return; }
  var mode=voiceMode();
  var localPossible=false;
  try{ localPossible=('speechSynthesis' in window); }catch(e){}
  var tryLocal=function(err){
    if(!localPossible){ sayFailHint(err==='policy'?null:'本机语音也不可用，请在设置里检查朗读引擎状态'); if(cb) cb(); return; }
    speakLocal(t,lang,rate,pitch,function(){
      if(err==='policy') sayFailHint(null);   /* 网络被拦且本机不可靠时，提示用户检查环境 */
      if(cb) cb();
    });
  };
  if(mode==='local'){
    if(!localPossible){ sayFailHint('本机语音在此浏览器不可用，请到设置里切回「自动」'); if(cb) cb(); return; }
    speakLocal(t,lang,rate,pitch,cb); return;
  }
  netSpeak(t,lang,function(ok,err){
    if(ok){ if(AUDIO_STATE==='unknown') AUDIO_STATE='net'; if(cb) cb(); return; }
    if(mode==='net'){
      if(err==='policy') sayFailHint('浏览器阻止了网页发声：请点地址栏的声音图标，或换用系统浏览器打开');
      else if(err==='timeout') sayFailHint('网络语音超时，请检查网络后重试');
      if(cb) cb(); return;
    }
    tryLocal(err);   /* auto：网络失败 → 本机兜底 */
  },1);
}

/* 不拆分的字母组合（视为一个辅音，保证切分正确） */
var SYL_BLENDS=['ph','th','ch','sh','ck','ng','qu','wh','tch','dge','gh','kn','wr','mb'];
function breakdown(word){
  var raw=String(word||'').trim();
  if(!raw) return null;
  var lower=raw.toLowerCase();

  /* 句首冠词（the/a/an）不参与音节切分，单独作为轻声前缀 */
  var base=lower, prefix='';
  var pm=lower.match(/^(the|a|an)\s+(.+)$/);
  if(pm){ prefix=pm[1]; base=pm[2]; }

  var hit=SYL_DICT[base];
  var parts;
  if(hit){
    parts=hit[0].map(function(s,i){ return {syl:s,stress:(i===hit[1]),dict:true}; });
  }else{
    /* 启发式：元音群切分（教学向） */
    var s=base.replace(/[^a-z]/g,'');
    if(!s) return null;
    var V=function(ch){ return 'aeiouy'.indexOf(ch)>=0; };
    var vgs=[];
    for(var i=0;i<s.length;){
      if(V(s[i])){ var j=i; while(j<s.length&&V(s[j])) j++; vgs.push([i,j]); i=j; }
      else i++;
    }
    if(!vgs.length) return null;
    /* 尾部不发音 e（-le 保留自成音节） */
    var n=vgs.length,last=vgs[n-1];
    if(s[last[0]]==='e'&&last[1]-last[0]===1&&n>1){
      if(s[last[0]-1]!=='l'){ vgs[n-2][1]=last[1]; vgs.pop(); }
    }
    var cuts=[];var segCount=function(mid){
      if(!mid) return 0;
      var c=0;for(var k=0;k<mid.length;){ var two=mid.substr(k,2);
        if(SYL_BLENDS.indexOf(two)>=0){ c++; k+=2; } else { c++; k++; } }
      return c;
    };
    for(var k=1;k<vgs.length;k++){
      var mid=s.slice(vgs[k-1][1],vgs[k][0]);
      var lc=segCount(mid);
      if(lc<=1) cuts.push(vgs[k-1][1]);      /* V·CV */
      else cuts.push(vgs[k-1][1]+1);          /* VC·CV / VC·CCV */
    }
    parts=[];var st=0;cuts.push(s.length);
    for(var c=0;c<cuts.length;c++){ var seg=s.slice(st,cuts[c]); if(seg) parts.push({syl:seg,stress:false}); st=cuts[c]; }
    var si=(parts.length<=1)?0:(parts.length===2?0:parts.length-2);
    parts=parts.map(function(p,i){ p.stress=(i===si); return p; });
  }
  /* 词根含义标注（有效应用：re + bound → 再次·返回 + 弹回） */
  var means=[];
  parts.forEach(function(p){
    var key=p.syl;
    if(AFFIX_DESC[key]){ p.mean=AFFIX_DESC[key]; means.push({syl:key,mean:AFFIX_DESC[key]}); }
  });
  /* 冠词前缀放到最前，不参与重音与含义 */
  if(prefix) parts.unshift({syl:prefix,stress:false,quiet:true});
  return {word:raw,parts:parts,means:means};
}
function utter(txt,stress,rate,vol){
  var u=new SpeechSynthesisUtterance(String(txt));
  u.lang='en-US'; u.pitch=stress?1.22:(rate?1.02:1.0);
  u.rate=stress?0.66:(rate||0.85);
  u.volume=(vol==null?(stress?1:0.92):vol);
  var v=bestVoice(); if(v) u.voice=v;
  return u;
}
var speaking=null;
function highlightPart(i){
  try{
    var el=document.getElementById('wdPlay');
    if(!el) return;
    var arr=el.querySelectorAll('.wd-part');
    for(var k=0;k<arr.length;k++) arr[k].classList.toggle('playing',k===i);
  }catch(e){}
}
/* 拆解朗读：re → bound → rebound（网络 TTS 逐音节 · 重音加重 · 整词收束） */
function speakParts(word){
  var bd=breakdown(word);
  if(!bd||bd.parts.length<=1){ speak(word,'en-US',0.78); return; }
  if(voiceMode()==='local'){ speakPartsLocal(word); return; }
  var parts=bd.parts,i=0,netOK=true;
  highlightPart(-1);
  function play(){
    if(!netOK){ /* 网络中途失败 → 本机拆解兜底（保持拆解朗读体验） */
      highlightPart(-1);
      speakPartsLocal(word);
      return;
    }
    if(i>=parts.length){
      highlightPart(-1);
      setTimeout(function(){ /* 整词收束，稍慢更清楚 */
        netSpeak(word,'en',function(ok){ if(!ok) speakLocal(word,'en-US',0.78); highlightPart(-1); },1);
      },320);
      return;
    }
    var p=parts[i]; i++;
    highlightPart(i-1);
    netSpeak(p.syl,'en',function(ok){
      if(!ok){ netOK=false; play(); return; }
      play();
    }, p.quiet?0.62:(p.stress?1:0.82)); /* 冠词轻读 · 重音更响亮 */
  }
  play();
}
/* 本机 speechSynthesis 拆解（离线兜底） */
function speakPartsLocal(word){
  if(!('speechSynthesis' in window)){ sayFailHint('本机语音不可用，请到设置里检查朗读引擎状态'); return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  var bd=breakdown(word);
  if(!bd||bd.parts.length<=1){ speakLocal(word,'en-US',0.78); return; }
  var parts=bd.parts,i=0;
  highlightPart(-1);
  function play(){
    if(i>=parts.length){
      highlightPart(-1);
      setTimeout(function(){
        var u=utter(word,false,0.72,1);
        u.onend=function(){ speaking=null; highlightPart(-1); };
        speaking=u; speechSynthesis.speak(u);
      },380);
      return;
    }
    var p=parts[i];i++;
    highlightPart(i-1);
    var u=utter(p.syl,p.stress,p.quiet?0.95:0.85,p.quiet?0.65:null);
    u.onend=function(){ play(); };
    speaking=u; speechSynthesis.speak(u);
  }
  play();
}
/* 统一入口：单词 → 拆解朗读（多音节）或整词慢读（单音节） */
function speakWord(word){
  var bd=breakdown(word);
  if(bd&&bd.parts.length>1) speakParts(word);
  else speak(word,'en-US',0.78);
}
/* 拆解胶囊 UI：<span class="wd" id="wdPlay"><span class="wd-part">re</span><span class="wd-part stress">′bound</span></span> */
function breakdownHtml(en,showMean){
  var bd=breakdown(en);
  if(!bd){ return '<span class="en-text" style="font-size:15px">'+esc(en)+'</span>'; }
  var h='<span class="wd" id="wdPlay" title="点击：先逐个读音节，再连读整词" onclick="event.stopPropagation();speakWord(\''+escJs(en)+'\')">';
  bd.parts.forEach(function(p){
    h+='<span class="wd-part'+(p.quiet?' quiet':'')+(p.stress?' stress':'')+(p.mean?' hasmean':'')+'" data-i="'+esc(p.syl)+'" title="'+(p.quiet?'轻读':(p.mean?'词根 '+esc(p.syl)+'-：'+esc(p.mean):'读音节 '+esc(p.syl)))+'">'+(p.stress?'′':'')+esc(p.syl)+(p.mean?'<i>'+esc(p.mean)+'</i>':'')+'</span>';
  });
  h+='</span>';
  if(showMean&&bd.means.length){
    h+='<div class="wd-mean">'+bd.means.map(function(m){ return '<span class="wd-mean-item">'+esc(m.syl)+'- '+esc(m.mean)+'</span>'; }).join('<span class="wd-plus">+</span>')+'</div>';
  }
  return h;
}

  if(/ing$/.test(en)) tries.push(en.slice(0,-3));
  if(/ed$/.test(en)) tries.push(en.slice(0,-2));
  for(var i=0;i<tries.length;i++){ var t=tries[i]; if(t&&MINI_DICT[t]) return MINI_DICT[t]; }
  return '';
}

function parseText(raw){

    else if(/明天/.test(full)) out.date=addDays(todayStr(),1);
    else if(/昨天/.test(full)) out.date=addDays(todayStr(),-1);
  }
  if(!out.date){ out.date=todayStr(); out.uncertain.push('日期'); }

  var tk=full.match(/(?:课题|主题|Unit|unit|Lesson|lesson)[：: ]*([^\n，。]{1,26})/);
  if(tk) out.title=tk[1].trim();
  else{ var h=lines.find(function(l){ return /^(Unit|Lesson|L\d+|U\d+|第\s*[一二三四五六七八九十\d]+\s*(课|单元))/.test(l); }); if(h) out.title=h; }
  if(!out.title){ out.title='新学习单元'; out.uncertain.push('课题'); }
  /* 目标 */
  var g=full.match(/(?:目标|学习目标)[：: ]*([^\n]{2,40})/);
  if(g) out.goal=g[1].trim();
  /* 链接 */
  var urlRe=/(https?:\/\/[^\s\u4e00-\u9fff""''<>，。；]+)/g, um, urls=[];
  while((um=urlRe.exec(full))) urls.push(um[1]);
  urls.forEach(function(u){
    var host=(u.match(/^https?:\/\/([^\/]+)/)||[])[1]||'', title='网页链接', cat='link';
    if(/youtube\.com|youtu\.be/.test(host)){ title='YouTube 视频'; cat='video'; }
    else if(/bilibili\.com|b23\.tv/.test(host)){ title='哔哩哔哩视频'; cat='video'; }
    else if(/v\.qq\.com/.test(host)){ title='腾讯视频'; cat='video'; }
    else if(/weixin\.qq\.com|mp\.weixin\.qq\.com/.test(host)){ title='微信公众号文章'; cat='article'; }
    else if(/xiaohongshu|xhslink/.test(host)){ title='小红书链接'; }
    out.resources.push({type:cat,title:title,url:u});

  var noLink=lines.filter(function(l){ return !urlRe.test(l); });

  var cjk=function(s){ return /[\u4e00-\u9fff]/.test(s); };

  var isEngOnly=function(l){ return /^[A-Za-z0-9\s'\-.,!?;:"()…·]+$/.test(l)&&/[a-zA-Z]{3,}/.test(l); };
  var isTaskLine=function(l){ return /^(作业|练习|要求|完成|背诵|跟读|朗读|抄写|复习|预习|打卡|听|看)/.test(l); };

    /* 纯英文行/短句：先整行查短语词典，未命中再逐词提取（截图1：The lion.） */
    if(isEngOnly(l)){

      if(zm) zh=zm[1].trim();
      var focus=[];
      (en.toLowerCase().match(/[a-z]+/g)||[]).forEach(function(w){ if(seen[w]&&STOPW.has(w)===false&&focus.indexOf(w)<0) focus.push(w); });

    var pm=l.match(/^[【\[]?(作业|练习|要求|任务|完成|背诵|跟读|朗读|抄写|复习|预习|打卡)[】\]]?[：:、\s]*(.+)/);
    if(pm) t=pm[2].trim();
    else if(/^[【\[]?(单词|词汇)[】\]]?[：:、\s]*(.+)/.test(l)) t='背单词：'+l.match(/^[【\[]?(单词|词汇)[】\]]?[：:、\s]*(.+)/)[1].trim();
    if(t) out.homework.push(t);
  });
  /* 家长引导 + 任务 */
  var topWord=out.vocab[0]||null, topSen=out.sentences[0]||null;
  if(topSen){
    out.parentPrompt={q:topSen.en+' Can you say it with me?', a:'你问孩子“'+topSen.en+'”，孩子跟读后，指着家里的东西一起说，让句子有画面感。'};
  } else if(topWord){
    out.parentPrompt={q:'What is this? It is a '+(topWord.en||'...')+'.', a:'指着实物或图片问孩子 "What is this?"，引导孩子回答 "It is a '+topWord.en+'.'+(topWord.zh?('"（'+topWord.zh+'）'):'')+'"'};
  } else {
    out.parentPrompt={q:'Today we learned something new. What did you like best?', a:'用英文问孩子今天最喜欢什么，孩子可以用中文答，家长再用英文重复一遍关键词。'};
  }
  out.tasks=[
    {type:'video',label:'看视频'},
    {type:'words',label:'认单词'},
    {type:'talk',label:'亲子对话'},
    {type:'read',label:'跟读录音'},
    {type:'game',label:'小游戏'}
  ];
  if(!out.vocab.length&&!out.sentences.length&&!out.resources.length&&!out.homework.length) out.uncertain.push('未识别出有效内容，请检查粘贴的文本');

}
function classifyFile(name){
  var ext=String(name).split('.').pop().toLowerCase();
  if(/png|jpe?g|gif|webp|bmp/.test(ext)) return {cat:'课件',type:'image'};
  if(/pdf/.test(ext)) return {cat:'课件',type:'file'};
  if(/docx?|doc|wps/.test(ext)) return {cat:'练习',type:'file'};
  if(/xlsx?|xls|csv/.test(ext)) return {cat:'练习',type:'file'};
  if(/mp3|wav|m4a|aac|ogg/.test(ext)) return {cat:'音频',type:'audio'};
  if(/mp4|mov|avi|mkv|webm|flv/.test(ext)) return {cat:'视频',type:'video'};
  if(/ppt|pptx/.test(ext)) return {cat:'课件',type:'file'};
  return {cat:'练习',type:'file'};
}

function dataUrlToBlob(dataUrl){
  var parts=dataUrl.split(','), mime=(parts[0].match(/data:([^;]+)/)||[])[1]||'image/png';
  var bin=atob(parts[1]), arr=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);

}

}
function compressImage(dataUrl,maxW){

      var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      res(cv.toDataURL('image/jpeg',.82));

    img.src=dataUrl;
  });
}
function ocrLocal(dataUrl){

        return fetch(server+'/ocr',{method:'POST',body:blob,headers:{'Content-Type':'image/png'},signal:ctl2.signal});

/* 音/视频文件内容解析：音频→语音转文字；视频→抽帧字幕 + 语音转文字。

function analyzeMediaFile(dataUrl,type,ext){

function loadScript(src,timeoutMs){

/* ===== Tesseract 浏览器引擎：fast 快速模型 + 全局复用 worker + 空闲预热 ===== */
var OCR_WORKER=null;            /* 全局共享 worker：识别完不销毁，二次识别秒起（旧版每次都重建） */
var OCR_TESS_LOADING=null;      /* 加载中的 promise，防止并发重复加载 */
function ocrLoadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(OCR_TESS_LOADING) return OCR_TESS_LOADING;
  var cdns=['https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js','https://unpkg.com/tesseract.js@5/dist/tesseract.min.js'];
  OCR_TESS_LOADING=cdns.reduce(function(p,u){ return p.catch(function(){ return loadScript(u,8000); }); },Promise.reject())
    .then(function(){ OCR_TESS_LOADING=null; })
    .catch(function(){ OCR_TESS_LOADING=null; throw new Error('tesseract load fail'); });
  return OCR_TESS_LOADING;
}
function ocrGetWorker(onState){
  if(OCR_WORKER) return Promise.resolve(OCR_WORKER);
  var say=onState||function(){};
  return ocrLoadTesseract().then(function(){
    say('正在准备快速识别引擎（首次约 10 秒，之后秒开）…');
    /* fast 模型：体积/识别速度都比 best_int 快 2-3 倍，对微信截图印刷体足够 */
    return Tesseract.createWorker(['eng','chi_sim'],1,{logger:function(m){},langPath:'https://cdn.jsdelivr.net/gh/naptha/tessdata@gh-pages/4.0.0_fast'});
  }).then(function(w){ OCR_WORKER=w; return w; });
}
function ocrTesseract(dataUrl,onState){
  return new Promise(function(resolve){
    if(!S.settings.cdnOcr) return resolve(null);

    var timer=setTimeout(function(){ if(!settled){ settled=true; resolve(null); } },30000);
    function done(v){ if(!settled){ settled=true; clearTimeout(timer); resolve(v); } }
    var lastMsg='';
    function say(m){ if(m!==lastMsg){ lastMsg=m; onState&&onState(m); } }
    ocrGetWorker(onState).then(function(worker){
      return compressImage(dataUrl,900).then(function(small){
        say('识别中…');
        return worker.recognize(small).then(function(data){
          var t=(data.data&&data.data.text||'').trim();
          if(t) done({text:t,engine:'浏览器OCR(快速)'}); else done(null);
        });

    }).catch(function(){ done(null); });

/* 空闲预热：进平台几秒后静默把浏览器引擎初始化好（本地服务在线则跳过），用户点识别时直接秒出 */

      clearTimeout(tm);

      ocrGetWorker(null).catch(function(){});
    }).catch(function(){ clearTimeout(tm); ocrGetWorker(null).catch(function(){}); });
  }catch(e){}
}
function ocrImage(dataUrl,onState){
  return new Promise(function(resolve){
    var settled=false;
    var timer=setTimeout(function(){ if(!settled){ settled=true; resolve(null); } },40000);
    function done(r){ if(!settled){ settled=true; clearTimeout(timer); resolve(r); } }

  if(S.streak.last===todayStr()){}
  else if(S.streak.last===addDays(todayStr(),-1)){ S.streak.count++; S.streak.last=todayStr(); }
  else { S.streak.last=todayStr(); S.streak.count=1; }
  save();
  render();
  if(window.childOpen) renderChild();
  toast('已完成「'+esc(t.label)+'」，很棒！');
}
function answerPractice(en,correct){
  S.practice.attempts++;
  var w=wordGet(en);
  if(correct){
    S.practice.correct++;
    w.reviews.push({d:todayStr(),res:1});
    w.wrong=Math.max(0,(w.wrong||0)-1);
    w.mastery=Math.min(100,w.mastery+8);
    logWords(todayStr(),1);
  } else {
    w.wrong=(w.wrong||0)+1;
    w.reviews.push({d:todayStr(),res:0});
    w.mastery=Math.max(0,w.mastery-12);
    logWrong(todayStr());
  }
  save();
}
function reviewQueue(){
  var q=[];

    if(!last||last!==todayStr()) q.push(w);
  });
  return q.sort(function(a,b){ return ((b.wrong||0)-(a.wrong||0))||(a.mastery-b.mastery); }).slice(0,10);
}
function wrongWords(){ return Object.keys(S.words).map(function(k){ return S.words[k]; }).filter(function(w){ return (w.wrong||0)>0; }).sort(function(a,b){ return b.wrong-a.wrong; }); }

function resCard(u,r){
  var art='', meta=[];
  if(r.type==='video'){
    art=r.thumb?('<img src="'+r.thumb+'" alt="">'):'<div style="display:grid;place-items:center;width:100%;height:100%;color:var(--ink3)">'+I('video')+'</div>';
    if(r.dur) meta.push(esc(r.dur));
    if(r.source) meta.push('来源：'+esc(r.source));
    meta.push('<span style="cursor:pointer;font-weight:700;color:var(--green3);background:var(--green100)" onclick="playResource(\''+escJs(r.url||'')+'\',\''+escJs(r.title||'视频')+'\')" class="tag blue">▶ 播放</span>');
  } else if(r.type==='book'){
    art=r.thumb?('<img src="'+r.thumb+'" alt="">'):'<div style="display:grid;place-items:center;width:100%;height:100%;color:#9A6B14">'+I('book')+'</div>';
    meta.push('<span class="tag yellow">绘本</span>');
  } else if(r.type==='audio'){
    art='<div style="display:grid;place-items:center;width:100%;height:100%;color:var(--green3)">'+I('headphones')+'</div>';
    meta.push('<span class="tag green">音频</span>');
  } else if(r.type==='image'){
    art=r.thumb||r.url?('<img src="'+(r.thumb||r.url)+'" alt="" onclick="openLightbox(this.src)">'):'';
    meta.push('<span class="tag gray">图片</span>');
  } else {
    art='<div style="display:grid;place-items:center;width:100%;height:100%;color:var(--ink3)">'+I('fileText')+'</div>';
    meta.push('<span class="tag gray">'+esc(r.cat||'文件')+'</span>');
  }
  var noteTag=(r.note&&r.note.trim())?'<span class="tag green" style="cursor:pointer" onclick="viewResNote(\''+escJs(r.url||'')+'\',\''+escJs(r.title||'')+'\')">📝 文字稿</span>':'';
  var descHtml=(r.desc&&r.desc.trim())?'<div class="muted" style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:300px">'+esc(r.desc)+'</div>':'';
  return '<div class="res-card"><div class="thumb">'+art+(r.type==='video'?'<div class="play">'+I('play')+'</div>':'')+'</div>'
    +'<div class="r-info"><div class="r-title">'+esc(r.title||'资源')+'</div>'+descHtml+'<div class="r-meta">'+meta.join('')+noteTag+'</div></div>'
    +'<div class="r-act">'
    +(r.url?'<button class="btn sm ghost" title="查看/播放" onclick="playResource(\''+escJs(r.url)+'\',\''+escJs(r.title||'资源')+'\',\''+escJs(r.desc||'')+'\',\''+escJs(r.note||'')+'\')"><span data-ic="external"></span></button>':'')
    +(r.type==='audio'?'<button class="btn sm ghost" onclick="speakFromRes(\''+escJs(r.url||r.title)+'\')"><span data-ic="play"></span></button>':'')
    +'</div></div>';
}
function viewResNote(url,title){
  var r=null;
  for(var i=0;i<S.units.length;i++){
    var hit=S.units[i].resources.find(function(x){ return x.url===url; });
    if(hit){ r=hit; break; }
  }
  if(!r||(!r.note&&!r.frames)){ toast('这个资源没有文字稿'); return; }
  var txt=[];
  if(r.frames) txt.push('【视频画面字幕】\n'+r.frames);
  if(r.note) txt.push('【语音转文字】\n'+r.note);
  modal('📝 '+esc(title||'文字稿'), '<div style="white-space:pre-wrap;font-size:13px;line-height:1.8;max-height:52vh;overflow:auto;background:var(--green50);border-radius:10px;padding:12px">'+esc(txt.join('\n\n'))+'</div>',
    '<button class="btn sm" onclick="closeModal()">关闭</button>');
}
function playResource(url,title,desc,note){
  if(!url){ toast('这个资源没有链接，请手动到班级群查看'); return; }
  url=String(url);
  try{
    /* 本地上传的媒体（data:/blob:）或可直接播放的视频文件 → 弹窗播放器 */
    if(/^(data:|blob:)/i.test(url)||/\.(mp4|webm|ogg|ogv|mov|m4v|3gp|mpeg|mpg)(\?|#|$)/i.test(url)){
      openVideoPlayer(url,title||'视频'); return;
    }
    /* 网页链接（公众号/视频号/B站/YouTube/腾讯视频等）→ 平台内弹资源卡，不再直接跳出 */
    if(/^https?:\/\//i.test(url)||/^www\./i.test(url)){
      openLinkCard(url,title||'网页链接',desc||'',note||''); return;
    }
    toast('该素材没有可播放的地址，请到班级群查看原件');
  }catch(e){ toast('无法打开该素材'); }
}

/* ============ 学习档案（每天导入的内容按日期存档 · 家长选日期回看） ============ */
var arch={date:todayStr()};
function archivedDates(){
  var m={}; S.units.forEach(function(u){ if(u.date) m[u.date]=1; });
  return Object.keys(m).sort();
}
function archiveForDate(d){
  var us=unitByDate(d), vocab=[], seen={}, sentences=[], hw=[], res=[], tasks=0, done=0;
  us.forEach(function(u){
    (u.vocab||[]).forEach(function(v){ if(v&&v.en&&!seen[v.en]){ seen[v.en]=1; vocab.push(v); } });
    sentences=sentences.concat(u.sentences||[]);
    hw=hw.concat(u.homework||[]);
    res=res.concat(u.resources||[]);
    tasks+=u.tasks.length; done+=unitDoneCount(u);
  });
  return {date:d,units:us,vocab:vocab,sentences:sentences,hw:hw,res:res,tasks:tasks,done:done};
}
function archSet(d){ arch.date=d; render(); }

/* 按顺序连续朗读某天全部词汇（适合跟读复习） */
function speakArchVocab(d){
  var a=archiveForDate(d);
  var words=a.vocab.map(function(v){ return v.en; });
  if(!words.length){ toast('这一天没有词汇'); return; }
  var i=0;
  function next(){
    if(i>=words.length){ toast('朗读完毕 🎉'); return; }
    var w=words[i]; i++;
    speak(w,'en-US');
    setTimeout(next, Math.max(1500, 700+w.length*120));
  }
  next();
}

function reparseUnit(id){
  var u=unitById(id); if(!u) return;
  if(!u.source||!u.source.raw){ toast('这个单元没有可重新解析的原始文本（如来自截图/文件）'); return; }
  confirmDlg('将用原始文本重新解析这个单元：词汇、句型、作业、引导话术会被刷新；<b>你手动改过的内容、已完成的任务和掌握度会尽量保留</b>。要继续吗？',function(){
    var p=parseText(u.source.raw);
    var oldDone={}; u.tasks.forEach(function(t){ if(t.done) oldDone[t.type]=1; });
    var oldWords={}; u.vocab.forEach(function(v){ oldWords[v.en.toLowerCase()]=1; });
    u.title=p.title; u.goal=p.goal||u.goal; u.vocab=p.vocab; u.sentences=p.sentences;
    u.homework=p.homework; u.parentPrompt=p.parentPrompt; u.status=p.uncertain.length?'待确认':'已确认';
    /* 合并资源（保留手动添加的，URL 去重） */
    var urls={}; (u.resources||[]).forEach(function(r){ if(r.url) urls[r.url]=1; });
    p.resources.forEach(function(r){ if(!r.url||!urls[r.url]) u.resources.push(r); if(r.url) urls[r.url]=1; });
    /* 重建任务，保留已完成标记 */
    var doneSet={}; u.tasks.forEach(function(t){ if(t.done) doneSet[t.type]=1; });
    u.tasks=p.tasks.map(function(t,i){ return {id:uid('tk'),type:t.type,label:t.label,done:doneSet[t.type]||0}; });
    save(); render(); toast('重新解析完成'+(p.uncertain.length?'，部分内容标记为待确认':''));
  },'继续重解析');
}
function delUnit(id){
  var u=unitById(id); if(!u) return;

    S.units=S.units.filter(function(x){ return x.id!==id; });

}

/* ============ 游戏框架 ============ */
var G=null;
function openGame(kind,only){
  var pool=reviewQueue();
  if(!pool.length&&!(S.units.some(function(u){ return u.vocab.length; }))){ toast('还没有词汇，先去导入课程吧'); return; }
  if(!pool.length) pool=Object.keys(S.words).map(function(k){ return S.words[k]; });
  var target=only?S.words[String(only).toLowerCase()]:null;
  if(target&&pool.indexOf(target)<0) pool=[target].concat(pool);
  pool=pool.slice(0,10);
  G={kind:kind,pool:pool,score:0,total:0,idx:0,stars:0,last:null};
  document.getElementById('gameTitle').textContent={pic:'看图选词',match:'中英配对',order:'句子排序',listen:'听音辨词',read:'跟读录音'}[kind];
  document.getElementById('gameScore').textContent='';
  document.getElementById('gameWrap').classList.add('open');
  stepGame();
}
function closeGame(){ document.getElementById('gameWrap').classList.remove('open'); G=null; }
function stepGame(){
  var b=document.getElementById('gameBody');
  if(!G) return; /* 游戏已关闭时忽略挂起的定时器 */
  document.getElementById('gameScore').textContent=G.score+' 分';
  if(G.idx>=G.pool.length){ return gameDone(); }
  if(kindOf(G.kind)==='read'){ return gameRead(); }
  if(kindOf(G.kind)==='order'){ return gameOrder(); }
  if(kindOf(G.kind)==='match'){ return gameMatch(); }
  if(kindOf(G.kind)==='listen'){ return gameListen(); }
  gamePic();
}
function kindOf(k){ return k; }
function gameDone(){
  var stars=G.score>=G.total*0.9?3:(G.score>=G.total*0.6?2:(G.total?1:0));
  var h='<div style="text-align:center;padding:34px 0 20px">'
    +'<div style="font-size:54px;margin-bottom:8px">'+(stars===3?'🏆':stars===2?'🎉':'💪')+'</div>'
    +'<div style="font-size:22px;font-weight:700;color:var(--green3)">完成了！</div>'
    +'<div class="star-line">'+[1,2,3].map(function(i){ return I('star',i<=stars?'':'off'); }).join('')+'</div>'
    +'<div style="margin:10px 0 4px;color:var(--ink2)">答对 '+G.score+' / '+G.total+' 题</div>'
    +'<div class="muted">'+(stars===3?'太棒了，可以给家长一个大大的拥抱':stars===2?'不错哦，明天再巩固一下':G.total?'今天先到这里，错词会进错词本': '')+'</div>'
    +'</div>'
    +'<div class="game-actions"><button class="btn" onclick="closeGame()">返回</button>'
    +'<button class="btn primary" onclick="openGame(\''+G.kind+'\')">再玩一次</button></div>';
  document.getElementById('gameBody').innerHTML=h;
  injectIcons(b=document.getElementById('gameBody'));
  if(stars>0){ celebrate(); if(window.childOpen) renderChildStars(); }
}
function celebrate(){
  var c=document.getElementById('celebrate');
  var chars=['★','✿','♪','●','✦'];
  for(var i=0;i<14;i++){
    var s=document.createElement('span');
    s.textContent=chars[i%chars.length];
    s.style.left=(8+Math.random()*84)+'%';
    s.style.fontSize=(16+Math.random()*22)+'px';
    s.style.color=['#E8653F','#DFA62E','#2F5D4C','#4A7B9D'][i%4];
    s.style.animationDelay=(Math.random()*0.6)+'s';
    c.appendChild(s);
    setTimeout(function(node){ return function(){ node.remove(); }; }(s),2900);
  }
}
function ansBtn(en,correct,next){
  G.total++;
  if(correct){ G.score++; answerPractice(en,true); }
  else { answerPractice(en,false); }
  next();
}

/* 句子排序 */
function gameOrder(){
  var sents=[];
  S.units.forEach(function(u){ u.sentences.forEach(function(s){ if(sents.length<8) sents.push(s); }); });
  if(!sents.length){ closeGame(); toast('还没有句型，先去导入课程吧'); return; }
  var s=sents[G.idx%sents.length];
  var words=s.en.split(/\s+/).filter(function(x){ return x; });
  if(words.length<3){ words=s.en.match(/[a-zA-Z']+/g)||[s.en]; }
  var pool=shuffle(words.slice());
  var slots=[];
  var h='<div class="section-title" style="justify-content:center">句子排序 <span class="en">Order</span></div>'
    +'<div style="text-align:center;font-size:13px;color:var(--ink3);margin-bottom:14px">点单词放到横线上，组成句子（点一下可以放回去）</div>'
    +'<div style="display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-bottom:16px;min-height:46px">'
    +pool.map(function(w,i){ return '<button class="order-word" data-i="'+i+'" data-w="'+esc(w)+'">'+esc(w)+'</button>'; }).join('')+'</div>'
    +'<div id="slotRow" style="display:flex;gap:7px;flex-wrap:wrap;justify-content:center;min-height:56px;padding:8px;background:var(--surface2);border-radius:11px"></div>'
    +'<div class="game-actions" style="margin-top:16px"><button class="btn" onclick="resetOrder()">'+I('refresh')+'重排</button><button class="btn primary" id="ordCheck" disabled>检查</button></div>';
  document.getElementById('gameBody').innerHTML=h;
  var state={used:[],order:[]};
  function paint(){
    document.querySelectorAll('.order-word').forEach(function(b){ b.classList.toggle('used',state.used.indexOf(+b.getAttribute('data-i'))>=0); });
    var row=document.getElementById('slotRow');
    row.innerHTML=state.order.map(function(it,i){
      return '<div class="order-slot" style="cursor:pointer" onclick="popOrder('+i+')">'+esc(it.w)+'</div>';
    }).join('');
    document.getElementById('ordCheck').disabled=state.order.length!==words.length;
    window._ordState=state;
    injectIcons(row);
  }
  window.popOrder=function(i){ state.order.splice(i,1); var w=state.order; state.used=w.map(function(x){ return x.i; }); paint(); };
  window.resetOrder=function(){ state.used=[]; state.order=[]; paint(); };
  document.querySelectorAll('.order-word').forEach(function(b){
    b.onclick=function(){
      var i=+b.getAttribute('data-i');
      if(state.used.indexOf(i)>=0){ popOrder(state.order.findIndex(function(x){ return x.i===i; })); return; }
      state.used.push(i); state.order.push({i:i,w:b.getAttribute('data-w')}); paint();
    };
  });
  window._ordCheck=function(){
    var mine=state.order.map(function(x){ return x.w; }).join(' ').toLowerCase().replace(/[^a-z']/g,' ');
    var good=s.en.toLowerCase().replace(/[^a-z']/g,' ');
    var ok=mine===good;
    answerPractice(s.focus&&s.focus[0]?s.focus[0]:'sentence',ok);
    G.total++; if(ok) G.score++;
    var row=document.getElementById('slotRow');
    row.innerHTML='<div style="font-size:18px;font-weight:700;font-family:var(--serif);color:'+(ok?'var(--green3)':'var(--red)')+'">'+esc(ok?'🎉 正确！':'正确是：'+s.en)+'</div>';
    setTimeout(function(){ if(G) G.idx++; stepGame(); },1500);
  };
  document.getElementById('ordCheck').onclick=function(){ window._ordCheck(); };
  window._ordState=state;
  paint();
}

function rateRead(stars){
  G.score+=stars; G.total+=1;
  var en=G._readEn||'sentence';
  var w=wordGet(en);
  w.reviews.push({d:todayStr(),res:1}); if(w.mastery<100) w.mastery=Math.min(100,w.mastery+10);
  logDone(todayStr(),1); logWords(todayStr(),1);

/* ============ 学习成长 ============ */

  var out=[];
  for(var i=n-1;i>=0;i--) out.push(addDays(todayStr(),-i));
  return out;
}
function doneOn(d){ return S.logs.filter(function(l){ return l.d===d; }).reduce(function(a,l){ return a+(l.done||0); },0); }
function wordsOn(d){ return S.logs.filter(function(l){ return l.d===d; }).reduce(function(a,l){ return a+(l.words||0); },0); }

/* 联网兜底翻译：离线词典未覆盖的词批量请求本地 /translate，只补值不重绘 */
function autoTranslatePreview(im,p){
  if(!p||!p.vocab) return;
  var miss=[];
  p.vocab.forEach(function(v){ if(!v.zh&&v.en&&miss.indexOf(v.en)<0) miss.push(v.en); });
  if(!miss.length) return;
  var proto=''; try{ proto=window.location.protocol; }catch(e){}
  if(proto!=='http:'&&proto!=='https:') return;
  fetch('/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({words:miss.slice(0,60)})})
  .then(function(r){ return r.json(); })
  .then(function(data){
    if(!data||!data.results) return;
    p.vocab.forEach(function(v){
      if(v.zh) return;
      var t=data.results[v.en];
      if(t&&typeof t==='string'&&t.trim()){ v.zh=t.trim(); v.src='api'; }
    });
    if(!window._pv||window._pv.imId!==im.id) return;
    var rows=document.querySelectorAll('#pvVocab .word-edit-row');
    p.vocab.forEach(function(v,i){
      if(!rows[i]) return;
      var inp=rows[i].querySelectorAll('input')[1];
      if(!inp) return;
      if(v.zh){ if(!inp.value) inp.value=v.zh; inp.placeholder='可修改'; }
      else if(!inp.value) inp.placeholder='未找到释义，可手填';
    });
  })
  .catch(function(){});
}

function confirmImport(id){
  var im=S.imports.find(function(x){ return x.id===id; }); if(!im||!window._pv||window._pv.imId!==id) return;
  var p=window._pv.p;
  var title=document.getElementById('pvTitle').value.trim()||p.title;

  var goal=document.getElementById('pvGoal').value.trim();
  var vocab=[], sentences=[], homework=[];
  document.querySelectorAll('#pvVocab .word-edit-row').forEach(function(row){
    var en=row.querySelector('.en').value.trim(); var zh=row.querySelectorAll('input')[1].value.trim();
    if(en) vocab.push({en:en.toLowerCase(),zh:zh,pos:'',ex:''});
  });
  document.querySelectorAll('#pvSen .word-edit-row').forEach(function(row){
    var en=row.querySelector('.en').value.trim(); var zh=row.querySelectorAll('input')[1].value.trim();
    if(en){
      var focus=[]; var seen={};
      (en.toLowerCase().match(/[a-z]+/g)||[]).forEach(function(w2){ if(vocab.some(function(v){ return v.en===w2; })&&!seen[w2]){ seen[w2]=1; focus.push(w2); } });
      sentences.push({en:en,zh:zh,focus:focus});
    }
  });
  document.querySelectorAll('#pvHw .word-edit-row').forEach(function(row){
    var x=row.querySelector('input').value.trim(); if(x) homework.push(x);
  });
  var res=(p.resources||[]).slice();
  var unit={id:uid('u'),date:date,title:title,goal:goal,status:p.uncertain.length?'待确认':'已确认',createdAt:Date.now(),
    source:{type:'text',raw:im.raw,imgs:[],files:[],links:res.filter(function(r){ return r.url; })},
    vocab:vocab,sentences:sentences,resources:res,homework:homework,parentPrompt:p.parentPrompt,
    tasks:(p.tasks||[]).map(function(t,i){ return {id:uid('tk'),type:t.type,label:t.label,done:0}; }),
    editable:true};
  S.units.push(unit);
  im.status='parsed'; im.unitId=unit.id; im.label=title;
  closePreview();
  save();
  render();
  toast('已生成单元「'+esc(title)+'」');
  setTimeout(function(){ navTo('unit',unit.id); },420);
}

function bindDrop(zoneId,inputId,onFiles){
  var z=document.getElementById(zoneId), inp=document.getElementById(inputId);
  if(!z||!inp) return;
  z.addEventListener('dragover',function(e){ e.preventDefault(); z.classList.add('over'); });
  z.addEventListener('dragleave',function(){ z.classList.remove('over'); });
  z.addEventListener('drop',function(e){ e.preventDefault(); z.classList.remove('over'); if(e.dataTransfer.files.length) onFiles(Array.prototype.slice.call(e.dataTransfer.files)); });
  inp.addEventListener('change',function(){ if(inp.files.length) onFiles(Array.prototype.slice.call(inp.files)); inp.value=''; });
}
function pushImgs(files){

      impImgs.push(d);
      impOcrState='';
      renderImport();
    });
  });
}

function runOcr(){

  OCR_CANCEL=false;
  var st=document.getElementById('ocrState'); if(st) st.innerHTML='<span class="rec-dot"></span> 正在识别 '+impImgs.length+' 张截图… <a href="javascript:void(0)" onclick="cancelOcr()" style="color:var(--coral);margin-left:6px;text-decoration:underline">取消</a>';
  var texts=[], fails=0;
  (function next(i){
    if(OCR_CANCEL) return;
    if(i>=impImgs.length){
      var full=texts.join('\n');
      var im={id:uid('imp'),time:Date.now(),source:'screenshot',raw:full,imgs:impImgs.slice(),ocrText:full,status:'pending',label:'微信截图 '+impImgs.length+' 张'};
      S.imports.push(im); save();
      var st2=document.getElementById('ocrState');
      if(st2) st2.innerHTML=fails?('<span style="color:#9A6B14">识别完成，其中 '+fails+' 张未识别出文字（见下方预览，可直接补写或改用「粘贴文字」）</span>'):'';
      render();
      var p=parseText(full);
      showParsePreview(im,p);
      toast(fails?(fails+' 张截图未能识别，请在预览中手动补写'):'识别完成，请核对并生成单元');
      return;
    }
    var idx=i;
    ocrImage(impImgs[idx],function(msg){ var st3=document.getElementById('ocrState'); if(st3) st3.innerHTML='<span class="rec-dot"></span> 第 '+(idx+1)+'/'+impImgs.length+' 张：'+msg; }).then(function(r){
      if(r&&r.text){ texts.push(r.text); }
      else { fails++; texts.push('（第'+(idx+1)+'张未能识别出文字）'); }
      next(idx+1);
    });
  })(0);
}
